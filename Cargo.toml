[package]
name = "ship-6502"
version = "0.1.2"
edition = "2024"

[dependencies]
bevy = "0.16.1"
serde_json = "1.0.141"
serde = { version = "1.0.219", features = ["derive"] }

# Optimisation recommended in https://bevyengine.org/learn/quick-start/getting-started/setup/
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
